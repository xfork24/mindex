<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
<title id="title">Mindex — 管理海量视频素材，连接每一次创作</title>
<desc id="desc">Mindex 深绿色品牌横幅：导入素材、发现画面、创作成片。</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#142d25"/><stop offset="1" stop-color="#305b48"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a8c5a9" stroke-opacity=".06"/></pattern>
</defs>
<rect width="1280" height="480" rx="24" fill="url(#bg)"/>
<rect width="1280" height="480" rx="24" fill="url(#grid)"/>
<circle cx="1145" cy="85" r="210" fill="#a4c590" opacity=".05"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="80" y="82" fill="#b5d0b5" font-size="14" letter-spacing="4">MANAGE. DISCOVER. CREATE.</text>
<text x="76" y="182" fill="#f4f6ee" font-size="86" font-weight="700" letter-spacing="-5">mindex<tspan fill="#b9cd91">.</tspan></text>
<text x="80" y="238" fill="#f4f6ee" font-size="30" font-weight="500">管理海量视频素材，连接每一次创作。</text>
<text x="80" y="278" fill="#b8ccbd" font-size="17">视频资产管理 · 多模态检索 · AI 视频创作</text>
<g transform="translate(80 333)">
<rect width="330" height="84" rx="12" fill="#f4f6ee" fill-opacity=".07" stroke="#b8ccbd" stroke-opacity=".2"/>
<text x="22" y="33" fill="#bbce94" font-size="13">01 / ORGANIZE</text><text x="22" y="61" fill="#f4f6ee" font-size="19">管理原片、镜头、片段与人物</text>
<path d="M346 42h22m-7-7 7 7-7 7" stroke="#bbce94" fill="none" stroke-width="2"/>
<rect x="386" width="330" height="84" rx="12" fill="#f4f6ee" fill-opacity=".07" stroke="#b8ccbd" stroke-opacity=".2"/>
<text x="408" y="33" fill="#bbce94" font-size="13">02 / DISCOVER</text><text x="408" y="61" fill="#f4f6ee" font-size="19">用文字、图片或视频找到画面</text>
<path d="M732 42h22m-7-7 7 7-7 7" stroke="#bbce94" fill="none" stroke-width="2"/>
<rect x="772" width="330" height="84" rx="12" fill="#bbce94"/>
<text x="794" y="33" fill="#30513c" font-size="13">03 / CREATE</text><text x="794" y="61" fill="#183328" font-size="19">拆分镜、配音、剪辑与成片</text>
</g></g></svg>

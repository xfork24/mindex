<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="[[0,&quot;ui.acfbb1e1a397&quot;]]">Mindex · 视频检索</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css?v=20261020-recall-controls">
  <script src="/messages.js?v=20261019-shot-media-6" defer></script><script src="/i18n.js?v=20261018-i18n" defer></script><script src="/multiselect.js?v=20261019-ui-layout" defer></script><script src="/app.js?v=20261020-cascading-filters" defer></script>
<script src="/shot-player.js?v=20261019-shot-media-6"></script>
</head>
<body>
  <header><a class="brand" href="/">m<span>index</span><i></i></a><nav class="page-nav" aria-label="页面导航 / Main navigation"><a class="quiet nav-link" href="/" aria-current="page" data-i18n="[[0,&quot;ui.c9b1e68e3537&quot;]]">视频检索</a><a class="quiet nav-link" href="/studio" data-i18n="[[0,&quot;ui.b6fc3cef0bd0&quot;]]">创作</a><a class="quiet nav-link" href="/admin" data-i18n="[[0,&quot;ui.f517302fec0d&quot;]]">素材管理</a><a class="quiet nav-link" href="/persons" data-i18n="[[0,&quot;ui.0973ef28d791&quot;]]">人物库</a><a class="quiet nav-link" href="/settings" data-i18n="[[0,&quot;ui.7debf9cb0372&quot;]]">设置</a></nav><button id="refresh" class="quiet" data-i18n="[[0,&quot;ui.7cc7f07a2c03&quot;]]">刷新状态</button><button type="button" class="quiet language-switch" data-language-toggle aria-label="中文 / English"><span data-language="zh" lang="zh-CN">文</span><span class="language-divider" aria-hidden="true">/</span><span data-language="en" lang="en">En</span></button></header>
  <main>
    <section class="intro"><span class="eyebrow" data-i18n="[[0,&quot;ui.dcb5151061db&quot;]]">从一句描述，找到一个画面</span><h1 data-i18n="[[0,&quot;ui.26be7bcfa843&quot;]]">让素材回应你的想法。</h1><p data-i18n="[[0,&quot;ui.7a0275149990&quot;]]">搜索动作、场景、情绪或一句对白，找到值得使用的视频片段。</p></section>
    <section class="search-panel" aria-label="搜索素材" data-i18n-aria-label="ui.7c97e4265af4">
      <div class="tabs" role="tablist" aria-label="查询方式" data-i18n-aria-label="ui.67037cb96e6b">
        <button id="text-tab" class="tab active" role="tab" aria-selected="true" aria-controls="text-input" data-i18n="[[0,&quot;ui.dad5ed449c85&quot;]]">文字找视频</button>
        <button id="image-tab" class="tab" role="tab" aria-selected="false" aria-controls="image-input" data-i18n="[[0,&quot;ui.07e80d382810&quot;]]">图片找视频</button>
        <button id="video-tab" class="tab" role="tab" aria-selected="false" aria-controls="video-input" data-i18n="[[0,&quot;ui.7663e73034f1&quot;]]">视频找相似片段</button>
      </div>
      <form id="search-form">
        <div id="text-input" role="tabpanel" aria-labelledby="text-tab"><label class="sr-only" for="query" data-i18n="[[0,&quot;ui.4dd0c7963b63&quot;]]">描述想找的画面</label><textarea id="query" rows="3" maxlength="4000" placeholder="例如：雨夜，一个人坐在窗边，强忍眼泪，镜头慢慢推近…" data-i18n-placeholder="ui.3ef93d96bf61"></textarea>
          <div class="examples"><span data-i18n="[[0,&quot;ui.7b13ef5f91a0&quot;]]">试着描述</span><button type="button" data-query="一个人欲言又止，强忍眼泪的近景" data-i18n-data-query="ui.035d390408af" data-i18n="[[0,&quot;ui.dd8aa236a06d&quot;]]">含蓄情绪</button><button type="button" data-query="两个人在夜晚的街道争吵，其中一人转身离开" data-i18n-data-query="ui.a67e9ae46dd8" data-i18n="[[0,&quot;ui.f50b7e6128c3&quot;]]">人物互动</button><button type="button" data-query="从背后拍摄一个人走进空旷房间" data-i18n-data-query="ui.63bd3494026d" data-i18n="[[0,&quot;ui.87878d621aaf&quot;]]">镜头角度</button></div>
        </div>
        <div id="image-input" class="search-media-input" role="tabpanel" aria-labelledby="image-tab" hidden><label class="upload" for="image-file" id="image-drop"><span class="upload-symbol">↥</span><strong data-i18n="[[0,&quot;ui.4ae55af3694d&quot;]]">选择一张参考图片</strong><span id="image-file-label" data-i18n="[[0,&quot;ui.2caffec04326&quot;]]">JPEG、PNG、WebP 静态图片 · 最大 20MB</span><span class="upload-hint" data-i18n="[[0,&quot;ui.293ffaf6e1cf&quot;]]">也可以把图片直接拖到这里</span><input id="image-file" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="image-preview" alt="参考图片预览" hidden data-i18n-alt="ui.039bbea93b63"></div>
        <div id="video-input" class="search-media-input" role="tabpanel" aria-labelledby="video-tab" hidden><label class="upload" for="video-file" id="video-drop"><span class="upload-symbol">↥</span><strong data-i18n="[[0,&quot;ui.4483f7fef0d8&quot;]]">选择一段参考视频</strong><span id="file-label" data-i18n="[[0,&quot;ui.67fd2fc9b41a&quot;]]">最长 30 秒 · 最大 100MB</span><span class="upload-hint" data-i18n="[[0,&quot;ui.373edd22c7f2&quot;]]">也可以把视频直接拖到这里</span><input id="video-file" type="file" accept="video/*"></label><video id="query-preview" controls hidden></video></div>
        <details class="filters" id="person-filters" open><summary data-i18n="[[0,&quot;ui.9f5242332fcc&quot;]]">筛选人物</summary>
          <div class="filter-grid" id="person-controls"><label data-i18n="[[0,&quot;ui.acc714bb0167&quot;]]">演员（可多选）<select id="actor-select" multiple aria-describedby="person-hint"></select></label><label data-i18n="[[0,&quot;ui.224f21d3016f&quot;]]">角色（可多选）<select id="role-select" multiple aria-describedby="person-hint"></select></label><div class="person-search-options"><label data-i18n="[[0,&quot;ui.06cf3151c450&quot;]]">人物检索方式<select id="person-mode"><option value="auto" data-i18n="[[0,&quot;ui.be93a225bcfb&quot;]]">人物出镜 / 对白提及</option><option value="onscreen" data-i18n="[[0,&quot;ui.bc9173082f3e&quot;]]">人物出镜</option><option value="mentioned" data-i18n="[[0,&quot;ui.cbf394311140&quot;]]">对白提及</option></select></label><label data-i18n="[[0,&quot;ui.ac954c28b468&quot;]]">多人物关系<select id="person-relation"><option value="all" data-i18n="[[0,&quot;ui.859a27c20c56&quot;]]">同时出镜 / 全部提及</option><option value="any" data-i18n="[[0,&quot;ui.f61923e57f20&quot;]]">任一人物</option></select></label></div></div><p id="person-hint" class="muted" aria-live="polite" data-i18n="[[0,&quot;ui.adb050b9cc83&quot;]]">先选演员，角色列表会按出演关系过滤；不选演员时列出全部角色。</p>
        </details>
        <details class="filters" open><summary data-i18n="[[0,&quot;ui.b69364bcbc04&quot;]]">筛选素材</summary><div class="material-filters"><label data-i18n="[[0,&quot;ui.df2bc29adabb&quot;]]">素材范围<select id="source" multiple aria-describedby="source-hint"></select><span id="source-hint" class="muted" data-i18n="[[0,&quot;ui.c1b8365074c7&quot;]]">可多选；不选时搜索全部素材。</span></label><div class="filter-grid material-filter-fields"><label data-i18n="[[0,&quot;ui.625b392c7b8a&quot;]]">场景<input id="scene" placeholder="例如：室内、雨夜" data-i18n-placeholder="ui.722889427cbf"></label><label data-i18n="[[0,&quot;ui.61fe61644a75&quot;]]">人物情绪<input id="emotion" placeholder="例如：悲伤、克制" data-i18n-placeholder="ui.d637fe8494d8"></label><label data-i18n="[[0,&quot;ui.6867f7b4537a&quot;]]">景别<input id="shot-size" placeholder="例如：近景、特写" data-i18n-placeholder="ui.79b85267c636"></label><label data-i18n="[[0,&quot;ui.26b6f15b345b&quot;]]">最短时长（秒）<input id="min-duration" type="number" min="0" step="0.1"></label><label data-i18n="[[0,&quot;ui.2de8ce6144b7&quot;]]">最长时长（秒）<input id="max-duration" type="number" min="0.1" step="0.1"></label></div></div></details>
        <div class="form-bottom"><label data-i18n="[[0,&quot;ui.770c916c8efa&quot;]]">检索粒度<select id="granularity"><option value="moment" data-i18n="[[0,&quot;ui.5aca155225fc&quot;]]">精细片段</option><option value="shot" data-i18n="[[0,&quot;ui.5d649f75d54a&quot;]]">完整镜头</option><option value="scene" data-i18n="[[0,&quot;ui.337ba7da75d2&quot;]]">连续场景</option></select></label><label data-i18n="[[0,&quot;ui.63a1fd1a6eab&quot;]]">返回数量<select id="limit"><option>20</option><option>10</option><option>50</option></select></label><button class="quiet" id="filter-reset" type="button" data-i18n="[[0,&quot;ui.4bbc4e5fd9db&quot;]]">清除筛选</button><button class="submit" id="search-button" type="submit" data-i18n="[[0,&quot;ui.b4ad13f10b53&quot;]]">查找片段 <span>↗</span></button></div>
      </form>
    </section>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <section class="results-section"><div class="results-heading"><h2 data-i18n="[[0,&quot;ui.bc5df71373fd&quot;]]">检索结果 <span id="result-count"></span></h2><span id="timing"></span></div><div id="results" class="results"><div class="empty"><span>⌕</span><h3 data-i18n="[[0,&quot;ui.2cb75dbbe057&quot;]]">你要找的画面，从这里开始</h3><p data-i18n="[[0,&quot;ui.063116e094a4&quot;]]">输入描述，或上传参考图片、视频。</p></div></div></section>
    <details class="library-status"><summary data-i18n="[[0,&quot;ui.ee3a656f795c&quot;]]">素材库状态 <span id="library-summary" data-i18n="[[0,&quot;ui.fcabadb2a772&quot;]]">正在读取…</span></summary><div id="library-detail"></div></details>
  </main>
  <footer><span data-i18n="[[0,&quot;ui.324b4bf6a897&quot;]]">Mindex / 素材检索工作台</span><span data-i18n="[[0,&quot;ui.ee0bd86ae2e6&quot;]]">文字、图片与视频查询 · 本地素材库</span></footer>
  <dialog id="detail-dialog"><button id="close-dialog" class="quiet close" aria-label="关闭详情" data-i18n-aria-label="ui.6a3082724a14">✕</button><div id="detail-content"></div></dialog>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mindex · 创作</title><link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/studio.css">
  <script src="/studio.js?v=20261013-refinement" defer></script>
</head>
<body class="studio">
  <header><a class="brand" href="/">m<span>index</span><i></i></a><span class="header-note">创作</span><a class="quiet nav-link" href="/">视频检索 ↗</a><a class="quiet nav-link" href="/admin">素材管理 ↗</a><button id="reload" class="quiet">刷新任务</button></header>
  <main class="studio-main">
    <section class="studio-intro"><span class="eyebrow">文案 · 分镜 · 配音 · 混剪</span><h1>从一段文字，到一条成片。</h1><p>把文案拆成分镜，逐镜配音并从素材库召回画面，自动合成为带字幕的视频。每一步可单独执行、重试和人工调整。</p></section>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <div class="workspace">
      <aside class="job-panel" aria-label="创作任务">
        <form id="create-form"><label for="create-text">创作文案</label><textarea id="create-text" rows="5" maxlength="2000" placeholder="输入一段解说文案，例如：山风吹过山谷，远处的寺庙亮着灯。有人推门进来，抖落一身雪……"></textarea>
          <details class="advanced"><summary>高级选项</summary><label>音轨<select id="create-audio-mode"><option value="tts_only">仅配音（丢弃原声）</option><option value="ducking">配音 + 原声氛围</option></select></label><label>字幕<select id="create-burn"><option value="true">烧录进画面</option><option value="false">软字幕轨道</option></select></label><label>召回数量<select id="create-recall-limit"><option>20</option><option>10</option><option>50</option></select></label></details>
          <button class="submit" id="create-button" type="submit">创建任务 <span>↗</span></button></form>
        <p class="muted">提示：烧录字幕需要 ffmpeg 带 libass；素材库需已有就绪索引。</p>
        <div id="job-list" aria-label="任务列表"></div>
      </aside>
      <section class="work-panel" aria-label="任务工作区">
        <div id="no-job" class="empty"><h2>选择一个创作任务</h2><p>在左侧创建新任务，或点击已有任务查看进度、编辑分镜与选片。</p></div>
        <div id="job-workspace" hidden>
          <div id="job-header"></div>
          <div id="steps-bar" class="steps-bar" role="list"></div>
          <div class="run-actions"><button id="run-all" class="quiet">继续执行未完成步骤</button><span id="job-meta" class="muted"></span></div>
          <section id="storyboard-section" hidden><div class="section-head"><h2>分镜</h2><span id="storyboard-warning" class="warn-text"></span><span class="head-actions"><button id="toggle-edit" class="quiet">编辑分镜</button><button id="save-storyboard" class="quiet" hidden>保存分镜</button><button id="cancel-storyboard" class="quiet" hidden>取消编辑</button></span></div><div id="storyboard-view"></div></section>
          <section id="candidates-section" hidden><div class="section-head"><h2>召回候选</h2><span class="muted">点击缩略图预览；时长徽标为候选时长 / 配音时长</span></div><div id="candidates-view"></div></section>
          <section id="timeline-section" hidden><div class="section-head"><h2>选片结果</h2><span class="head-actions"><select id="apply-mode" hidden></select><button id="save-timeline" class="quiet" hidden>保存换选</button><button id="cancel-timeline" class="quiet" hidden>取消换选</button></span></div><div id="timeline-view"></div></section>
          <section id="artifacts-section"><div class="section-head"><h2>产物与调试记录</h2><button id="reload-artifacts" class="quiet">刷新产物</button><a id="download-archive" class="quiet nav-link">下载任务 ZIP ↧</a></div><div id="artifact-view"></div></section>
          <section id="result-section" hidden><div class="section-head"><h2>成片</h2><span class="head-actions"><a id="download-mp4" class="quiet nav-link">下载成片 ↧</a><a id="download-srt" class="quiet nav-link">下载字幕 ↧</a></span></div><video id="final-video" controls preload="metadata"></video></section>
        </div>
      </section>
    </div>
  </main>
  <dialog id="play-dialog" aria-labelledby="play-title"><button id="play-close" type="button" class="quiet close" aria-label="关闭播放">✕</button><h2 id="play-title"></h2><video id="play-video" controls preload="metadata"></video><p id="play-meta" class="muted"></p></dialog>
  <footer><span>Mindex / 创作</span><span>本地素材库 · 工作流分步执行</span></footer>
</body>
</html>

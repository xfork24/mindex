# 配置模板：复制为 config.local.yaml 后修改。此文件配置部署后端与模型服务连接，不启动任何模型服务。
# 下列 192.168.1.86 等局域网地址仅为示例，请替换为自己的部署，或在设置页配置并激活模型档案。
# 完整键说明见 docs/config-reference.md；未知键会使配置校验失败。
# 部署后端请在实际使用的 config.local.yaml 中始终显式填写当前值，不依赖省略后的默认值。
# 加载优先级：--config 指定文件 > MINDEX_CONFIG > 当前目录 config.local.yaml（不合并多个文件）。
# 下方为本地模式；部署后端不能在设置页修改，修改后须重启 API、worker 等相关进程。
# 切换已有库的数据库/媒体/向量后端需先迁移数据，修改 backend 不会自动搬迁现有数据。
data_dir: ./data
server:
  role: api  # api：业务 API；agent-gateway：单实例智能助手网关；worker 用 mindex worker 启动
  form: local  # local | pg-single | cluster | auto；显式形态与后端组合不一致时拒绝启动
  # local：下方五个本地 backend；pg-single：postgres 数据库 + 未全部共享的其余后端，单机过渡用。
  # cluster：database/queue/locks=postgres、vector=chroma_server、storage=s3，必须全部配置。
  # auto：按上述后端组合推断形态；部署时建议显式指定 local/pg-single/cluster。
  library_id: null  # null 不预先指定；填写已有库 UUID 可阻止连接错误的库，不用于创建/更改库身份
# 元数据库 backend 选项：sqlite（本地 <data_dir>/metadata.sqlite3）| postgres（PostgreSQL）。
# 选择 postgres：取消下方 postgres 段的注释，在环境变量中设置 DSN，先运行
# mindex --config config.local.yaml migrate 初始化/升级 schema，再启动服务。
# DSN 示例：postgresql://用户:密码@数据库主机:5432/数据库名?sslmode=verify-full；凭据不写入 YAML。
# 多 API/多机还需同时切换其余四个共享后端并设 server.form=cluster；仅换数据库不构成集群。
database:
  backend: sqlite
  # postgres:
  #   dsn_env: MINDEX_DATABASE_DSN  # 保存 DSN 的环境变量名，API/worker/迁移进程均需设置
  #   pool_min: 0  # 查询池最小连接数，必须 <= pool_max
  #   pool_max: 8  # 每进程查询池最大连接数；数据库总预算还需乘副本数并计入 worker/维护连接
  #   control_pool_max: 2  # 每进程独立控制池上限，用于心跳和租约维护
  #   connection_budget: 10  # 当前进程查询池 + 控制池的总连接上限
  #   checkout_timeout: 30  # 查询池等待连接超时（秒，>0）
  #   control_checkout_timeout: 5  # 控制池等待连接超时（秒，>0）
# 向量 backend 选项：chroma_local（<data_dir>/chroma）| chroma_server（独立 Chroma 服务）。
# 选择 chroma_server：需 database.backend=postgres，取消连接段注释并填写服务地址；
# 若服务启用认证，在 token_env 指定的环境变量中设置令牌，YAML 不填写令牌明文。
vector:
  backend: chroma_local
  # chroma_server:
  #   url: http://127.0.0.1:8000  # 替换为各节点可访问的 http/https 地址
  #   token_env: MINDEX_CHROMA_TOKEN  # 保存 Bearer 令牌的环境变量名
# 任务分发 backend 选项：inline（API 进程内执行）| postgres（PG 持久队列，至少一次交付）。
# 选择 postgres：需 database.backend=postgres，另启动 mindex --config config.local.yaml worker；
# worker 与 API 使用同一逻辑库的部署配置和连接凭据；只启动 API 不会消费持久队列。
queue:
  backend: inline
# 具名锁 backend 选项：file（本机 data_dir 文件锁，跨进程）| postgres（跨节点 PG 租约锁）。
# 选择 postgres：需 database.backend=postgres，复用 database.postgres 连接，无额外连接段。
locks:
  backend: file
# 媒体 backend 选项：local（data_dir 本机文件系统）| s3（S3 兼容对象存储）。
# 选择 s3：需 database.backend=postgres，取消下方 s3 段注释并配置已有 bucket、服务地址和凭据环境变量。
# prefix 是可选的部署前缀；程序自动追加 libraries/<库UUID无连字符>/，不要重复填写库 UUID。
# S3 模式仍需各节点本地暂存目录；其预算用 s3.staging_quota_gb/min_free_gb 配置。
storage:
  backend: local
  staging_quota_gb: 0  # 本地模式节点工作集预算（GiB）；0 不限，>0 启用预算
  # s3:
  #   endpoint_url: http://127.0.0.1:9000  # 替换为各节点可访问的 S3/MinIO 服务地址
  #   bucket: mindex  # 已创建的桶名
  #   prefix: ""  # 例如 mindex-prod；空字符串表示只使用程序追加的库前缀
  #   region: ""  # 按对象存储要求填写，例如 us-east-1；兼容服务可留空
  #   access_key_id_env: MINDEX_S3_ACCESS_KEY
  #   secret_access_key_env: MINDEX_S3_SECRET_KEY
  #   staging_quota_gb: 100  # 每节点暂存预算（GiB，>0）
  #   min_free_gb: 20  # 暂存磁盘最小剩余空间（GiB，>=0）
  #   presign_expire_seconds: 900  # 预签名 URL 有效期（秒，>=60）
# 关闭时允许不同素材/不同类型处理并行；开启时沿用全局管线互斥。
enforce_gpu_lock: false
# 素材上传每文件 20 GiB，独立于 search.max_upload_mb（检索查询视频）。
source_upload_max_bytes: 21474836480
embedding:
  # mindex = 本项目自定义服务；llama_cpp = 用户现有 llama-server，详见 docs/e2e-runbook.md。
  backend: mindex
  deployment_manifest: null
  base_url: http://192.168.1.86:4010
  model: tencent/WeMM-Embedding-9B
  revision: main
  quantization: int8
  dimensions: 4096
  timeout: 180
  api_key_env: MINDEX_MODEL_API_KEY
analyzer:
  # auto 优先关闭思考；GLM-5.3、MiniMax-M3.1 强制思考时设 low。
  thinking_mode: auto
  # 无效 JSON / 字段校验失败 / 空正文 / 聊天格式错误 / HTTP 500 后，最多再试 5 次（共 6 次请求）。
  response_retries: 5
  # 分镜分析、场景分组和场景分析均从 12768 开始，无效响应后逐次翻倍。
  initial_output_tokens: 12768
  # 输出预算含推理 token；按厂商支持范围设置上限。
  max_output_tokens: 131072
  backend: openai
  deployment_manifest: null
  base_url: http://192.168.1.86:4040/v1
  model: qwen3.8:27b
  revision: deployed-2026-10-12
  timeout: 180
  api_key_env: MINDEX_QWEN_API_KEY
asr:
  backend: mindex
  deployment_manifest: null
  aligner_model: Qwen/Qwen3-ForcedAligner-0.6B
  aligner_revision: c7cbfc2048c462b0d63a45797104fc9db3ad62b7
  base_url: http://192.168.1.86:4020
  model: Qwen/Qwen3-ASR-1.7B
  revision: main
  timeout: 180
  api_key_env: MINDEX_MODEL_API_KEY
  enabled: true
  # llama_cpp / openai（聊天式）后端单次转写请求的输出 token 上限。
  max_tokens: 32768
studio:
  # 创作工作流（文本生成视频）：拆分镜 LLM + TTS + 召回选片 + 渲染合成。
  max_input_chars: 2000
  max_shots: 1024
  # 可用素材摘要总字符预算（0–100000，默认 12000，0 表示关闭）：
  # 文案创作与拆分镜参考当前任务素材的画面分析摘要，使文案与召回词贴近素材实际画面。
  material_digest_chars: 12000
  # 每个方案登记的参考文稿总字数上限（整数，默认 30000），超限上传/粘贴返回 422。
  max_reference_chars: 30000
  # 分镜画面来源“上传片段”（clip）的视频上限：时长（秒）与文件大小（MB）；
  # 来源图片沿用 search.max_image_upload_mb。查询视频仍按 search.max_query_seconds / max_upload_mb。
  max_clip_seconds: 300
  max_clip_mb: 500
  generator:
    # 文本拆分镜 LLM，OpenAI 兼容端点（llama-server GGUF）。
    backend: openai
    base_url: http://192.168.1.86:4040/v1
    model: qwen3.8:27b
    revision: deployed-2026-10-12
    timeout: 180
    api_key_env: MINDEX_QWEN_API_KEY
    max_tokens: 4000
    split_retries: 2
  writer:
    # 文案创作 LLM：按视频大纲写旁白正文；省略本段时复制 generator。
    # split_retries 在这里表示输出不合格时的重试次数。
    backend: openai
    base_url: http://192.168.1.86:4040/v1
    model: qwen3.8:27b
    revision: deployed-2026-10-12
    timeout: 180
    api_key_env: MINDEX_QWEN_API_KEY
    max_tokens: 4000
    split_retries: 2
  tts:
    # qwen3-tts 语音合成，OpenAI /audio/speech 风格端点（llama-server GGUF）。
    backend: openai
    base_url: http://192.168.1.86:4030/v1
    model: Qwen3-TTS
    voice: Cherry
    response_format: wav
    speech_path: /audio/speech
    timeout: 180
    api_key_env: MINDEX_QWEN_API_KEY
  video_generator:
    # “AI 生成视频”分镜的视频生成服务（generate 阶段）；缺省关闭，设置页激活“视频生成”档案即启用。
    # 设置页首次启动会建好默认档案：MiniMax H3（激活）与本地 ComfyUI（备用）。
    # backend: minimax_h3（MiniMax H3 V2，base_url https://api.minimax.cn；生成方式在创作页逐镜设置）/
    # minimax（海螺，base_url https://api.minimax.cn/v1）/ dashscope（通义万相，
    # base_url https://dashscope.aliyuncs.com）/ comfyui（自建，需导入 API 格式工作流与节点映射）。
    enabled: false
    backend: comfyui
    base_url: http://127.0.0.1:8188
    model: ""
    api_key_env: MINDEX_VIDEO_API_KEY
    timeout: 600
    poll_interval: 5
    max_wait: 900
    durations: [5.0]
    fps: 16
    comfyui_workflow: null
    comfyui_mapping: null
  # “AI 生成图片”分镜的图片生成服务（draw 阶段）：默认 MiniMax image-01；backend 可为 minimax / comfyui。
  # image_generator:
  #   enabled: false
  #   backend: minimax
  #   base_url: https://api.minimax.cn/v1
  #   model: image-01
  #   api_key_env: MINDEX_IMAGE_API_KEY
  # 配音列背景音乐的音乐生成服务（music 阶段）：默认 MiniMax music-3.0（翻唱 music-cover、歌词生成）；
  # backend 可为 minimax / comfyui（ComfyUI 映射字段 prompt/lyrics/seconds/seed/audio，不支持歌词生成）。
  # music_generator:
  #   enabled: false
  #   backend: minimax
  #   base_url: https://api.minimax.cn/v1
  #   model: music-3.0
  #   cover_model: music-cover
  #   api_key_env: MINDEX_MUSIC_API_KEY
  # AI 动画分镜的动画生成 LLM（animate 阶段）：写 HTML/JS 动画后在沙箱逐帧录制。
  # 设置页首次启动会建好默认档案 GLM-5.3-Flash（智谱 https://open.bigmodel.cn/api/paas/v4，需填写 API Key）并激活。
  # 省略整段时复制 agent.llm 的 backend/base_url/model/revision/api_key_env，并跟随设置页激活的智能助手档案；
  # 录制需要可选依赖：uv sync --extra animation && uv run playwright install chromium
  # animator:
  #   enabled: true
  #   backend: openai            # openai（OpenAI 兼容）/ anthropic（Messages 协议）
  #   base_url: https://api.deepseek.com/v1
  #   model: deepseek-chat
  #   api_key_env: MINDEX_AGENT_API_KEY
  #   timeout: 600
  #   max_tokens: 16000
  #   retries: 2
  #   max_html_kb: 200
  #   max_capture_seconds: 60
  recall:
    # shot 适合含镜头粒度的索引；纯 visual 模式索引可改为 moment。
    granularity: shot
    limit: 20
  selection:
    atempo_limit: 0.1
    gap_epsilon: 0.5
    weights:
      semantic: 1.0
      duration: 1.0
      extension: 0.3
      repeat: 0.5
      overlap: 1.0
  audio:
    mode: tts_only
    duck_gain: 0.15
    loudnorm: "I=-16:TP=-1.5:LRA=11"
  subtitle:
    burn: false
    font_family: Noto Sans CJK SC
    font_file: null
    font_size: 7
  render:
    width: 1280
    height: 720
    fps: 25
    crf: 20
    preset: fast
    # 方案画幅 → 分辨率（宽高为偶数）。16:9 恒为上面的 width/height（这里若写必须一致）；
    # 未列出的画幅用默认值 9:16 → 720×1280、1:1 → 1080×1080。
    # canvases:
    #   "9:16": [720, 1280]
    #   "1:1": [1080, 1080]
detector:
  # adaptive works on the local CPU. Use transnet for the supplied GPU service.
  backend: adaptive
  base_url: http://192.168.1.86:18203
  api_key_env: MINDEX_MODEL_API_KEY
  threshold: 0.5
  adaptive_threshold: 3.0
  min_content_val: 10.0
video:
  short_shot_seconds: 6
  window_seconds: 4
  stride_seconds: 3
  fps: 4
  max_frames: 24
  max_pixels: 262144
  analysis_frames: 12
search:
  # 新版（format 2）索引的三渠道 RRF 权重；必须同时给出三个键。
  channel_weights:
    visual: 0.35
    dialogue: 0.15
    analysis: 0.5
  candidates: 100
  rrf_k: 30
  duration_weight: 0.15  # 任务召回：时长匹配占比，0 禁用，最多 0.5
  duration_exponent: 2.0  # 不足时得分 (候选时长/分镜预估时长)^指数
  # 旧版（format 1）索引的五路权重，与 channel_weights 互不影响。
  weights:
    video: 0.35
    description: 0.35
    style: 0.1
    dialogue: 0.1
    lexical: 0.1
  max_upload_mb: 100
  max_image_upload_mb: 20
  max_query_seconds: 30

# 独立人物服务；不改变内容分镜或 WeMM 空间。
person:
  base_url: http://127.0.0.1:4050
  model: cheetah_l
  model_root: ~/.insightface
  frame_interval: 15
  fps: 5  # 兼容旧配置，不参与人物抽帧
  # 仅用于展示帧，不参与特征/匹配缓存身份；0 = 不缩放。
  frames_max_edge: 640
  frames_jpeg_quality: 85
  face_threshold: 0.55
  face_margin: 0.1
  # 帧人脸质量门槛：低于此值的视频帧不接受自动确认。
  min_face_quality: 0.6
  # 参考图质量门槛：低于此值的参考图不参与匹配；0 = 全部参与。
  min_reference_quality: 0
  body_threshold: 0.8
  # 首次启动后将 /health 的 space 完整复制到此处，以固定模型文件摘要及预处理。
  expected_space: null

# 磁盘清理（mindex clean）；分级与判定详见 docs/cleanup.md。所有天数为 mtime 年龄。
clean:
  # 除活动版本外额外保留的最近 ready 索引版本数（向量复用与回退来源）。
  index_keep_versions: 2
  # 未注册上传文件 / 空上传目录 / 无记录助手附件目录的宽限小时数，防正在进行的上传。
  # 助手附件按 agent.attachment_ttl_hours 过期，由 B 级规则 agent_attachments 回收。
  temp_grace_hours: 24
  # 旧配置指纹检查点：转写 / 分析 / 对白（换配置后永不命中的目录）。
  transcripts_max_age_days: 30
  analysis_max_age_days: 30
  dialogue_max_age_days: 30
  # 可按需重建的缓存：在线播放转码 / shot 媒体合成 / studio 分镜预览。
  context_max_age_days: 14
  shot_media_max_age_days: 7
  studio_preview_max_age_days: 14
  # studio 旧 attempt 目录（未被检查点或当前 attempt 引用）与导出 zip。
  studio_attempt_max_age_days: 30
  studio_export_max_age_days: 60
  # reports 导出产物 / 字幕解析缓存（不含 uploads 用户原件）。
  reports_max_age_days: 60
  subtitles_max_age_days: 30
  # runs 审计表已完成记录（running 一律保留）。
  runs_max_age_days: 90

# 智能助手（全局面板 /api/agent，详见 docs/agent.md）。模型也可在设置页「智能助手」角色里配置档案。
agent:
  enabled: true
  context_window_steps: 256  # 执行步数不限；模型输入滚动保留最近的步骤（1–256）
  max_context_tokens: 60000  # 发送给模型的历史估算上限；超出时先省略较早的工具结果
  secret_ttl_seconds: 1800   # 表单收集的密钥引用（secret://）有效期
  attachment_ttl_hours: 168  # 助手附件（attachment://）有效期；过期后由 mindex clean 回收
  attachment_max_mb: 500     # 单个附件上限（MiB），超出返回 413
  max_images: 8              # 单次模型请求最多携带的图片数（只保留最近的）
  llm:
    backend: openai          # openai（OpenAI 兼容 tools 协议）或 anthropic（原生 Messages 协议）
    base_url: https://api.deepseek.com/v1
    model: deepseek-chat
    api_key_env: MINDEX_AGENT_API_KEY
    timeout: 180
    max_tokens: 4096         # 单次回复的输出上限，不是上下文容量
    context_window: null    # 模型总上下文容量（dsh）；如 1048576，留空沿用 max_context_tokens
    vision: false            # 模型支持图片输入时开启：附件图片与工具抽取的画面会一并发给模型（受 max_images 限制）
  mcp:
    http_enabled: false      # 开启后挂载 streamable-http /mcp，需设置 MINDEX_MCP_TOKEN
    policy: read             # read / write / all：MCP 调用方允许执行的最高风险级别
    token_env: MINDEX_MCP_TOKEN
    # domains: null 导出全部领域；也可只导出部分领域（另外总会导出 report_capability_gap），
    # 可选 studio / studio_detail / library / search / index / persons / settings / topics，例如：
    # domains: [search, library]
    domains: null

# 选题挖掘（创作 → 选题挖掘，/api/topics，详见 docs/topics.md）。领域档案、数据源与定时时刻在页面里设置。
topics:
  # llm: 缺省复用 studio.writer；需要单独的选题模型时按 studio.writer 的字段填写。
  scheduler:
    enabled: true            # mindex serve 运行时按档案定时每天挖掘；错过的定时在启动时补跑
    timezone: null           # IANA 时区；本地缺省用系统时区，PG 缺省 UTC，首次启动绑定到库，所有节点必须一致
  fetch:
    timeout: 15              # 单次请求超时（秒）；数据源只请求你配置的地址，不内置爬虫
    max_bytes: 2097152       # 单次响应上限
    item_days: 30            # 候选条目保留天数
  coverage:
    min_similarity: 0.3      # 候选粗筛；通过镜头分析相关性核验后才计为覆盖
    min_duration: 1.0        # 可用候选的最小时长（秒），排除极短转场
  brave:
    max_queries: 10          # 每次挖掘调用 Brave Search 的次数上限（计费保护）

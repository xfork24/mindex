<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mindex</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <!-- 外壳本地页面：启动中（mode=loading）与启动失败（mode=error）。文案由主进程经查询参数传入，只以 textContent 写入。 -->
  <main>
    <h1 id="title"></h1>
    <p id="message" role="status" aria-live="polite"></p>
    <div id="spinner" class="spinner" aria-hidden="true"></div>
    <pre id="detail" hidden></pre>
    <nav id="actions" hidden>
      <button type="button" data-command="retry" id="retry"></button>
      <button type="button" data-command="logs" id="logs"></button>
      <button type="button" data-command="quit" id="quit"></button>
    </nav>
  </main>
  <script src="shell.js"></script>
</body>
</html>

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mindex"
version = "0.1.0"
description = "视频素材管理、多模态检索、人物库与 AI 视频创作工作台"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20",
  "httpx>=0.28,<1", "pydantic>=2.10,<3", "PyYAML>=6,<7",
  "chromadb>=1.0,<2", "numpy>=1.26,<3", "jieba>=0.42.1",
  "scenedetect[opencv]>=0.6.6,<0.7", "typer>=0.15,<1", "filelock>=3.16",
  "Pillow>=11,<13",
  "charset-normalizer>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11", "mcp==1.30.0"]
person = ["supervision>=0.27,<0.28", "av>=14,<17"]
# 智能助手的 MCP 导出（streamable-http /mcp 与 `mindex mcp` stdio）；未安装时其余功能不受影响。
mcp = ["mcp==1.30.0"]

[project.scripts]
mindex = "mindex.cli:app"
mindex-person-server = "mindex.persons.person_server:main"
mindex-model-server = "mindex.models.model_server:main"

[tool.setuptools]
packages = [
  "mindex",
  "mindex.admin",
  "mindex.agent",
  "mindex.agent.llm",
  "mindex.agent.tools",
  "mindex.diagnostics",
  "mindex.maintenance",
  "mindex.models",
  "mindex.persons",
  "mindex.processing",
  "mindex.search",
  "mindex.settings",
  "mindex.shared",
  "mindex.studio",
  "mindex.web",
  "mindex.web.admin",
  "mindex.web.persons",
  "mindex.web.search",
  "mindex.web.settings",
  "mindex.web.shared",
  "mindex.web.studio",
]

[tool.setuptools.package-dir]
"mindex" = "backend/src"
"mindex.web" = "frontend/src"

[tool.setuptools.package-data]
"mindex.web" = ["*/*.html", "*/*.js", "*/*.css", "*/*.json", "*/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["backend/src"]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
# 显式规则集，避免随 ruff 版本默认值变化。
select = ["E4", "E9", "F", "I", "B", "UP", "RUF", "PLW", "PLE"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # 中文全角标点属于正常文本
  "RUF100", "RUF021", "RUF005", "RUF043", "B905", "UP042", "PLW2901", "PLW0108",  # 既有代码风格，未逐项清理
]

[tool.ruff.lint.isort]
known-first-party = ["mindex"]

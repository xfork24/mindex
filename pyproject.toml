[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mindex"
version = "0.1.0"
description = "视频素材管理、多模态检索、人物库与 AI 视频创作工作台"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20",
  "httpx>=0.28,<1", "pydantic>=2.10,<3", "PyYAML>=6,<7",
  "chromadb>=1.0,<2", "numpy>=1.26,<3", "jieba>=0.42.1",
  "scenedetect[opencv]>=0.6.6,<0.7", "typer>=0.15,<1", "filelock>=3.16",
  "Pillow>=11,<13",
  "charset-normalizer>=3,<4",
]

[project.optional-dependencies]
# 人物帧采样维护测试需要 PyAV；无需为测试安装整个人物推理环境。
dev = [
    "pytest>=8,<10",
    "ruff>=0.11",
    "mcp==1.30.0",
    "hypothesis==6.170.9",
    "av>=14,<17",
    "mypy==1.19.0",
    "types-pyyaml>=6.0.12.20261030",
]
person = ["supervision>=0.27,<0.28", "av>=14,<17"]
# 智能助手的 MCP 导出（streamable-http /mcp 与 `mindex mcp` stdio）；未安装时其余功能不受影响。
mcp = ["mcp==1.30.0"]
dsh = ["deepseek-harness-sdk==0.2.1rc2", "deepseek-harness-runtime-bin==0.2.1rc2", "mcp==1.30.0"]
# AI 动画分镜的沙箱录制（无头 Chromium 逐帧截图）；安装后还需 `uv run playwright install chromium`。
animation = ["playwright==1.64.1"]
cluster = [
    "psycopg-pool>=3.2,<4",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
mindex = "mindex.cli:app"
mindex-person-server = "mindex.persons.person_server:main"
mindex-model-server = "mindex.models.model_server:main"

[tool.setuptools]
packages = [
  "mindex",
  "mindex.admin",
  "mindex.agent",
  "mindex.agent.llm",
  "mindex.agent.tools",
  "mindex.diagnostics",
  "mindex.maintenance",
  "mindex.models",
  "mindex.persons",
  "mindex.processing",
  "mindex.search",
  "mindex.settings",
  "mindex.shared",
  "mindex.shared.backends",
  "mindex.shared.db",
  "mindex.studio",
  "mindex.studio.workspace",
  "mindex.studio.workspace.handlers",
  "mindex.studio.tools",
  "mindex.topics",
  "mindex.topics.sources",
  "mindex.web",
  "mindex.web.admin",
  "mindex.web.persons",
  "mindex.web.search",
  "mindex.web.settings",
  "mindex.web.shared",
  "mindex.web.studio",
]

[tool.setuptools.package-dir]
"mindex" = "backend/src"
"mindex.web" = "frontend/src"

[tool.setuptools.package-data]
"mindex.studio" = ["templates/*.yaml", "brands/*.yaml", "overlays/*.html", "platforms/*.yaml"]
"mindex.topics" = ["samples/*.csv"]
"mindex.web" = ["*/*.html", "*/*.js", "*/*.css", "*/*.json", "*/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: 完整 ffmpeg 管线、创作构建、备份迁移与浏览器 UI 等重媒体用例；CI 快速回归用 -m \"not slow\" 跳过，每晚完整运行",
  "requires_postgres: 真实 PostgreSQL 后端矩阵（MINDEX_TEST_POSTGRES_DSN 门控；缺 DSN 时 skip，集群实现必须在 CI 专项启用，plans §12）",
  "requires_s3: 真实 S3 兼容对象存储（MINDEX_TEST_S3_ENDPOINT 门控）",
  "requires_chroma_server: 独立 Chroma 服务（MINDEX_TEST_CHROMA_SERVER 门控）",
]

[tool.ruff]
src = ["backend/src"]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
# 显式规则集，避免随 ruff 版本默认值变化。
select = ["E4", "E9", "F", "I", "B", "UP", "RUF", "PLW", "PLE", "ASYNC", "BLE"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # 中文全角标点属于正常文本
  "RUF021", "RUF005", "RUF043", "B905", "UP042", "PLW2901", "PLW0108",  # 既有代码风格，未逐项清理
]

[tool.ruff.lint.isort]
known-first-party = ["mindex"]

# mypy 基线（2026-11 引入）：首批只查注解质量较好的 shared 与 models；起步豁免只许缩短
# （棘轮），脏模块清完后逐包开 check_untyped_defs、再把 processing/search 等加入 packages。
[tool.mypy]
# 与 CI 的 mypy 环境一致（3.12）。不能写 3.11：numpy >= 2.5 的 stub 使用 PEP 695
# `type` 语句，mypy 以 3.11 为目标时无法解析（CI 在 3.12 下解析到 numpy 2.5.x）。
# 运行时仍支持 3.11；3.11 兼容性由 requires-python 与测试覆盖。
python_version = "3.12"
mypy_path = [".mypy-shim"]
files = [".mypy-shim/mindex/shared", ".mypy-shim/mindex/models"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true


# 起步豁免（2026-11 基线：以下 17 个模块共 72 个错误，多为 Optional 未收窄与类型混用）。
# 棘轮：只许缩短——清完一个模块的错误就把该模块从列表删除，不新增豁免模块。
[[tool.mypy.overrides]]
module = [
  "mindex.shared.config", "mindex.shared.locks", "mindex.shared.process_ops",
  "mindex.shared.shot_media", "mindex.shared.storage",
  "mindex.models.animator", "mindex.models.compatibility", "mindex.models.deployment",
  "mindex.models.detectors", "mindex.models.image_generators", "mindex.models.llama_cpp",
  "mindex.models.model_server", "mindex.models.music_generators", "mindex.models.qwen",
  "mindex.models.storyboard", "mindex.models.video_generators", "mindex.models.writer",
]
ignore_errors = true

[dependency-groups]
dev = []

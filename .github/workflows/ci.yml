# 静态检查与离线测试分离；重媒体、备份按需运行，各组独立分片、失败即停并保留日志。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 18 * * *"  # 每天 UTC 18:00（北京时间 02:00）完整回归
  workflow_dispatch:
    inputs:
      full:
        description: "运行完整代码回归（追加媒体与备份专项）"
        type: boolean
        default: false
      package:
        description: "构建三平台安装包（耗时，发布前手动启用）"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 安装依赖
        run: uv sync --extra dev

      - name: ruff
        run: uv run ruff check backend/src tests

      - name: mypy（shared+models 基线）
        run: bash scripts/typecheck.sh

      - name: 文档链接
        run: uv run python scripts/check-doc-links.py

      - name: 界面文案镜像
        run: uv run python scripts/build-messages.py --check

      - name: 页面资源版本参数
        run: uv run python scripts/build-assets.py --check

      - name: 前端 JS 语法
        run: for f in frontend/src/*/*.js desktop/*.js desktop/lib/*.js desktop/scripts/*.js; do node --check "$f"; done

      - name: CLI 入口
        run: uv run mindex --help

  fast-tests:
    name: 常规回归 (${{ matrix.shard }}/2)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: 安装测试依赖
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          uv sync --extra dev --extra person
      - name: 常规回归（首次失败立即报告）
        run: |
          mkdir -p artifacts/tests
          set -o pipefail
          uv run pytest -q -x --tb=short --durations=15 --timeout=120 \
            --ci-suite=fast --ci-shard=${{ matrix.shard }}/2 \
            --ci-plan=artifacts/tests/fast-${{ matrix.shard }}.json \
            --junitxml=artifacts/tests/fast-${{ matrix.shard }}.xml 2>&1 | tee artifacts/tests/fast-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-fast-${{ matrix.shard }}
          path: artifacts/tests/
          retention-days: 14

  full-tests:
    name: 专项回归 (${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.parts }})
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: media, shard: 1, parts: 3 }
          - { suite: media, shard: 2, parts: 3 }
          - { suite: media, shard: 3, parts: 3 }
          - { suite: backup, shard: 1, parts: 2 }
          - { suite: backup, shard: 2, parts: 2 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: 安装测试依赖
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          uv sync --extra dev --extra person
      - name: 浏览器功能回归依赖
        if: matrix.suite == 'media'
        run: |
          version="$(node -p 'require("./desktop/package.json").devDependencies["playwright-core"]')"
          npm install --prefix "$RUNNER_TEMP/browser" --no-save --package-lock=false "playwright-core@$version"
          node "$RUNNER_TEMP/browser/node_modules/playwright-core/cli.js" install --with-deps chromium
          echo "MINDEX_PLAYWRIGHT_MODULE=$RUNNER_TEMP/browser/node_modules/playwright-core" >> "$GITHUB_ENV"
      - name: 专项回归（单用例超时输出线程栈）
        run: |
          mkdir -p artifacts/tests
          set -o pipefail
          uv run pytest -q -x --tb=short --durations=15 --timeout=240 \
            --ci-suite=${{ matrix.suite }} --ci-shard=${{ matrix.shard }}/${{ matrix.parts }} \
            --ci-plan=artifacts/tests/${{ matrix.suite }}-${{ matrix.shard }}.json \
            --junitxml=artifacts/tests/${{ matrix.suite }}-${{ matrix.shard }}.xml 2>&1 | tee artifacts/tests/${{ matrix.suite }}-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.suite }}-${{ matrix.shard }}
          path: artifacts/tests/
          retention-days: 14

  # 桌面版（三平台矩阵）：外壳纯逻辑、桌面相关后端测试与 Electron 开发模式冒烟。
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, shell: bash }
          - { os: windows-2025, shell: pwsh }
          - { os: ubuntu-24.04, shell: bash }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 ffmpeg 与 Electron 运行依赖
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg xvfb libgtk-3-0t64 libnss3 libasound2t64 libxss1 libgbm1
          fi

      - name: 安装 ffmpeg（Windows）
        if: runner.os == 'Windows'
        run: choco install -y ffmpeg

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: 安装依赖
        run: |
          uv sync --extra dev
          cd desktop && npm ci --no-audit --no-fund

      - name: 外壳纯逻辑
        working-directory: desktop
        run: node --test "test/*.test.js"  # 引号防 shell 展开，node 自行处理 glob（三平台一致）

      - name: 桌面相关后端测试
        env:
          PYTHONUTF8: "1"  # Windows：子进程缺省按控制台代码页编码，中文输出会 UnicodeEncodeError
        run: >-
          uv run pytest -q tests/test_desktop_health.py tests/test_desktop_frozen.py tests/test_desktop_config.py
          tests/test_media_binaries.py tests/test_local_services.py tests/test_browser_install.py
          tests/test_settings_local_services_ui.py tests/test_process_ops.py
          tests/test_work_budget.py

      - name: 冻结后端（含目标平台原生 dsh）
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build-desktop-sidecar.ps1
          else scripts/build-desktop-sidecar.sh; fi

      - name: 原生 dsh 握手（无系统 Node / uv / Python 的 PATH）
        shell: bash
        run: |
          work="$(mktemp -d)/dsh check"
          if [ "$RUNNER_OS" = "Windows" ]; then
            env PATH="$(cygpath -u -p "$SYSTEMROOT\\System32;$SYSTEMROOT")" \
              desktop/build/backend/mindex.exe -m mindex.desktop_check "$(cygpath -w "$work")" --dsh-only
          else
            env PATH="/usr/bin:/bin" desktop/build/backend/mindex -m mindex.desktop_check "$work" --dsh-only
          fi

      - name: Electron 开发模式冒烟
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a node tests/desktop_smoke.cjs
          else node tests/desktop_smoke.cjs; fi

  # 发布前显式启用：构建安装包并冒烟，避免每次完整代码回归都重复执行昂贵打包。
  desktop-package:
    if: github.event_name == 'workflow_dispatch' && inputs.package
    needs: desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, shell: bash,      artifact: mindex-desktop-macos-arm64 }
          - { os: windows-2025, shell: pwsh,  artifact: mindex-desktop-windows-x64 }
          - { os: ubuntu-24.04, shell: bash,  artifact: mindex-desktop-linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: MSYS2（Windows 随包 ffmpeg 构建工具链）
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            make
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-bzip2

      - name: 构建工具（非 Windows）
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install pkg-config; else
            sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config nasm libbz2-dev zlib1g-dev
          fi

      - name: Electron 运行依赖（Linux 冒烟用）
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0t64 libnss3 libasound2t64 libxss1 libgbm1

      - name: 缓存随包 ffmpeg
        uses: actions/cache@v4
        with:
          path: desktop/build/ffmpeg
          key: desktop-ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build-desktop-ffmpeg.sh') }}

      - name: 缓存 Electron 二进制
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}

      - name: 构建安装包
        shell: bash
        env:
          # setup-msys2 现装到 runner 工具缓存（不再是预装的 C:\msys64）——把实际安装位置
          # 告诉 build-desktop-win.ps1，否则它调用裸的预装实例、ucrt64 工具链全部缺失。
          MINDEX_MSYS2: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          uv sync --extra dev
          if [ "$RUNNER_OS" = "macOS" ]; then scripts/build-desktop-mac.sh
          elif [ "$RUNNER_OS" = "Linux" ]; then scripts/build-desktop-linux.sh
          else pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build-desktop-win.ps1; fi

      - name: 安装并冒烟（PATH 只留系统目录与 node）
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            mount="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -mountpoint "$mount" desktop/dist/Mindex-*-arm64.dmg
            ditto "$mount/Mindex.app" "$RUNNER_TEMP/Mindex.app"
            hdiutil detach "$mount"
            codesign --verify --deep --strict "$RUNNER_TEMP/Mindex.app"
            env PATH="/usr/bin:/bin" "$RUNNER_TEMP/Mindex.app/Contents/Resources/backend/mindex" \
              -m mindex.desktop_check "$RUNNER_TEMP/dsh installed check" --dsh-only
            env PATH="/usr/bin:/bin:$(dirname "$(command -v node)")" \
              MINDEX_SMOKE_APP="$RUNNER_TEMP/Mindex.app/Contents/MacOS/Mindex" node tests/desktop_smoke.cjs
          elif [ "$RUNNER_OS" = "Linux" ]; then
            executable="$(node -p 'require("./desktop/package.json").build.linux.executableName')"
            test -x "desktop/dist/linux-unpacked/$executable"
            env PATH="/usr/bin:/bin" desktop/dist/linux-unpacked/resources/backend/mindex \
              -m mindex.desktop_check "$RUNNER_TEMP/dsh installed check" --dsh-only
            env PATH="/usr/bin:/bin:$(dirname "$(command -v node)")" \
              MINDEX_SMOKE_APP="$PWD/desktop/dist/linux-unpacked/$executable" xvfb-run -a node tests/desktop_smoke.cjs
          else
            # Windows：Git Bash 只按 ':' 分隔 PATH（';' 分隔的整串会被当成一个目录名，
            # node/powershell 全部找不到）。改用 POSIX 形式的受限 PATH 交给 env——
            # env 按 ':' 找到 node.exe，MSYS 再为原生子进程转成 Windows 形式。
            # 保留 WindowsPowerShell\v1.0：外壳查进程父子关系（reapStale）要调 powershell。
            env PATH="$(cygpath -u -p "$SYSTEMROOT\\System32;$SYSTEMROOT")" \
              desktop/dist/win-unpacked/resources/backend/mindex.exe \
              -m mindex.desktop_check "$(cygpath -w "$RUNNER_TEMP/dsh installed check")" --dsh-only
            env PATH="$(cygpath -u -p "$SYSTEMROOT\\System32;$SYSTEMROOT;$SYSTEMROOT\\System32\\WindowsPowerShell\\v1.0"):$(dirname "$(cygpath -u "$(command -v node)")")" \
              MINDEX_SMOKE_APP="$(cygpath -w "$PWD/desktop/dist/win-unpacked/Mindex.exe")" node tests/desktop_smoke.cjs
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 14
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
            desktop/dist/mindex-desktop-ffmpeg-sources-*

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="[[0,&quot;ui.tools_page_title&quot;]]">Mindex · 第三方工具</title><link rel="icon" href="/assets/shared/favicon.svg?v=8d7f9242de" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/shared/style.css?v=e4cee29ab0"><link rel="stylesheet" href="/assets/shared/agent-panel.css?v=5ce91a25c0"><link rel="stylesheet" href="/assets/studio/studio.css?v=77c24dd741"><link rel="stylesheet" href="/assets/studio/templates.css?v=b8efb5756d">
  <script src="/assets/shared/messages.js?v=55c4b7123a" defer></script><script src="/assets/shared/i18n.js?v=42497bb7f1" defer></script><script src="/assets/shared/api.js?v=aa52e4865d" defer></script><script src="/assets/shared/marked.umd.js?v=b82b933440" defer></script><script src="/assets/shared/purify.min.js?v=cd37898f97" defer></script><script src="/assets/shared/agent-markdown.js?v=8f0018e90a" defer></script><script src="/assets/shared/agent-panel.js?v=e45b7f1ace" defer></script><script src="/assets/shared/feedback.js?v=4d2340032a" defer></script><script src="/assets/studio/tools.js?v=13252fee90" defer></script>
</head>
<body class="studio studio-templates studio-tools">
  <header><a class="brand" href="/">m<span>index</span><i></i></a><nav class="page-nav" aria-label="页面导航 / Main navigation"><a class="quiet nav-link" href="/" data-i18n="[[0,&quot;ui.c9b1e68e3537&quot;]]">视频检索</a><a class="quiet nav-link" href="/studio" aria-current="page" data-i18n="[[0,&quot;ui.b6fc3cef0bd0&quot;]]">创作</a><a class="quiet nav-link" href="/admin" data-i18n="[[0,&quot;ui.f517302fec0d&quot;]]">素材管理</a><a class="quiet nav-link" href="/persons" data-i18n="[[0,&quot;ui.0973ef28d791&quot;]]">人物库</a><a class="quiet nav-link" href="/settings" data-i18n="[[0,&quot;ui.7debf9cb0372&quot;]]">设置</a></nav><button id="reload" class="quiet" type="button" data-i18n="[[0,&quot;ui.tools_reload&quot;]]">刷新工具源</button><button type="button" class="quiet language-switch" data-language-toggle aria-label="中文 / English"><span data-language="zh" lang="zh-CN">文</span><span class="language-divider" aria-hidden="true">/</span><span data-language="en" lang="en">En</span></button></header>
  <main class="studio-main">
    <section class="studio-intro"><span class="eyebrow" data-i18n="[[0,&quot;ui.tools_eyebrow&quot;]]">HTTP · MCP · 白名单 · 上传授权</span><h1 data-i18n="[[0,&quot;ui.tools_heading&quot;]]">把外部生成工具接成分镜的画面来源。</h1><p data-i18n="[[0,&quot;ui.tools_intro&quot;]]">登记 HTTP 服务或 MCP 服务器，列出允许调用的工具、产物类型与是否允许携带素材上传；在分镜的画面来源里选择“第三方工具”即可调用。密钥只写不读。</p></section>
    <nav class="studio-tabs" aria-label="创作分区" data-i18n-aria-label="ui.studio_tabs_aria"><a class="studio-tab" id="studio-jobs-tab" href="/studio" data-i18n="[[0,&quot;ui.studio_tab_jobs&quot;]]">创作任务</a><a class="studio-tab" id="studio-topics-tab" href="/studio/topics" data-i18n="[[0,&quot;ui.studio_tab_topics&quot;]]">选题挖掘</a><a class="studio-tab" href="/studio/templates" data-i18n="[[0,&quot;ui.studio_tab_templates&quot;]]">文案模板</a><a class="studio-tab" href="/studio/brands" data-i18n="[[0,&quot;ui.studio_tab_brands&quot;]]">品牌模板</a><a class="studio-tab" href="/studio/music" data-i18n="[[0,&quot;ui.studio_tab_music&quot;]]">音乐库</a><a class="studio-tab" href="/studio/tools" aria-current="page" data-i18n="[[0,&quot;ui.studio_tab_tools&quot;]]">第三方工具</a></nav>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <div class="workspace">
      <aside class="job-panel template-panel" aria-label="工具源列表" data-i18n-aria-label="ui.tools_list_aria">
        <div class="detail-actions"><button id="tool-new" class="quiet" type="button" data-i18n="[[0,&quot;ui.tools_new&quot;]]">登记工具源</button></div>
        <div id="tool-list"></div>
      </aside>
      <section class="work-panel" aria-label="工具源详情" data-i18n-aria-label="ui.tools_detail_aria">
        <div id="tool-empty" class="empty"><h2 data-i18n="[[0,&quot;ui.tools_select_title&quot;]]">选择或登记一个工具源</h2><p data-i18n="[[0,&quot;ui.tools_select_hint&quot;]]">登记后测试连接，确认白名单中的工具都能被服务端找到。</p></div>
        <form id="tool-form" class="template-card template-form" novalidate hidden>
          <div class="section-head template-title-row">
            <h2 id="tool-title"></h2>
            <div class="head-actions"><button id="tool-test" class="quiet" type="button" data-i18n="[[0,&quot;ui.tools_test&quot;]]">测试连接</button><button id="tool-delete" class="quiet danger" type="button" data-i18n="[[0,&quot;ui.tools_delete&quot;]]">删除</button></div>
          </div>
          <div class="template-fields">
            <label class="form-field" data-i18n="[[0,&quot;ui.tools_field_id&quot;]]">工具源 ID<input id="tf-id" maxlength="40" pattern="[a-z0-9][a-z0-9-]*" required></label>
            <label class="form-field" data-i18n="[[0,&quot;ui.tools_field_name&quot;]]">名称<input id="tf-name" maxlength="60" required></label>
            <label class="form-field" data-i18n="[[0,&quot;ui.tools_field_protocol&quot;]]">协议<select id="tf-protocol"><option value="http">HTTP</option><option value="mcp-http">MCP (streamable-http)</option><option value="mcp-stdio">MCP (stdio)</option></select></label>
            <label class="form-field" data-i18n="[[0,&quot;ui.tools_field_hosts&quot;]]">产物下载主机（逗号分隔）<input id="tf-hosts" maxlength="1000"></label>
          </div>
          <label class="form-field" data-i18n="[[0,&quot;ui.tools_field_connection&quot;]]">连接设置（JSON）<textarea id="tf-connection" rows="10" spellcheck="false"></textarea></label>
          <p id="tf-connection-help" class="muted"></p>
          <div id="tool-entries" class="brand-section"></div>
          <div id="tool-secrets" class="brand-section"></div>
          <div class="template-form-foot"><span class="template-form-actions"><button id="tool-save" class="submit" type="submit" data-i18n="[[0,&quot;ui.tools_save&quot;]]">保存工具源</button></span></div>
          <p id="tool-error" class="warn-text" role="alert" hidden></p>
          <div id="tool-test-result" class="muted" role="status"></div>
        </form>
      </section>
    </div>
  </main>
  <footer><span data-i18n="[[0,&quot;ui.tools_footer&quot;]]">Mindex / 第三方工具</span><span data-i18n="[[0,&quot;ui.3c60f44b51aa&quot;]]">本地素材库 · 工作流分步执行</span></footer>
</body>
</html>

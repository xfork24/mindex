<!doctype html>
<html lang="zh-CN">
  <head>
    <script src="/assets/shared/i18n-boot.js?v=6ad8b45125"></script>
    <script src="/assets/shared/theme.js?v=06b5a45391"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n='[[0,"ui.acfbb1e1a397"]]'>Mindex · 视频检索</title>
    <link rel="icon" href="/assets/shared/favicon.svg?v=8d7f9242de" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/shared/style.css?v=7303c8f392" />
    <link rel="stylesheet" href="/assets/shared/agent-panel.css?v=4402a24df2" />
    <script src="/assets/shared/messages.js?v=6a8ef772ae" defer></script>
    <script src="/assets/shared/i18n.js?v=71113d017f" defer></script>
    <script src="/assets/shared/analysis-text.js?v=b3250c4c3c" defer></script>
    <script src="/assets/shared/api.js?v=799acf885b" defer></script>
    <script src="/assets/shared/control-layout.js?v=1278e93f03" defer></script>
    <script src="/assets/shared/group-controls.js?v=200a6e2ce7" defer></script>
    <script src="/assets/shared/marked.umd.js?v=b82b933440" defer></script>
    <script src="/assets/shared/purify.min.js?v=cd37898f97" defer></script>
    <script src="/assets/shared/agent-markdown.js?v=9dd4d8c653" defer></script>
    <script src="/assets/shared/agent-panel.js?v=11ba8e2e53" defer></script>
    <script src="/assets/shared/feedback.js?v=a83918f9e5" defer></script>
    <script src="/assets/shared/multiselect.js?v=580ad4713c" defer></script>
    <script src="/assets/search/app.js?v=f0683a1df3" defer></script>
    <script src="/assets/shared/shot-player.js?v=855e64534e"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="/">m<span>index</span><i></i></a>
      <nav class="page-nav" aria-label="页面导航" data-i18n-aria-label="ui.main_navigation">
        <a
          class="quiet nav-link"
          href="/search"
          aria-current="page"
          data-i18n='[[0,"ui.c9b1e68e3537"]]'
          >视频检索</a
        ><a class="quiet nav-link" href="/" data-i18n='[[0,"ui.b6fc3cef0bd0"]]'>创作</a
        ><a class="quiet nav-link" href="/admin" data-i18n='[[0,"ui.f517302fec0d"]]'>素材管理</a
        ><a class="quiet nav-link" href="/persons" data-i18n='[[0,"ui.0973ef28d791"]]'>人物库</a
        ><a class="quiet nav-link" href="/settings" data-i18n='[[0,"ui.7debf9cb0372"]]'>设置</a>
      </nav>
      <div class="header-actions">
        <button
          id="refresh"
          class="quiet"
          data-i18n='[[0,"ui.7cc7f07a2c03"]]'
          data-i18n-aria-label="ui.7cc7f07a2c03"
        >
          刷新状态</button
        ><button type="button" class="quiet theme-toggle" data-theme-toggle></button
        ><button
          type="button"
          class="quiet language-switch"
          data-language-toggle
          aria-label="中文 / English"
        >
          <span data-language="zh" lang="zh-CN">文</span
          ><span class="language-divider" aria-hidden="true">/</span
          ><span data-language="en" lang="en">En</span>
        </button>
      </div>
    </header>
    <main>
      <section class="intro">
        <h1 data-i18n='[[0,"ui.26be7bcfa843"]]'>视频检索</h1>
        <p data-i18n='[[0,"ui.7a0275149990"]]'>
          以文字、图片或视频为查询，在本地素材库中检索片段并按相关度排序。
        </p>
      </section>
      <section class="search-panel" aria-label="搜索素材" data-i18n-aria-label="ui.7c97e4265af4">
        <div
          class="tabs"
          role="tablist"
          aria-label="查询方式"
          data-i18n-aria-label="ui.67037cb96e6b"
        >
          <button
            id="text-tab"
            class="tab active"
            role="tab"
            aria-selected="true"
            aria-controls="text-input"
            data-i18n='[[0,"ui.dad5ed449c85"]]'
          >
            文字找视频
          </button>
          <button
            id="image-tab"
            class="tab"
            role="tab"
            aria-selected="false"
            aria-controls="image-input"
            data-i18n='[[0,"ui.07e80d382810"]]'
          >
            图片找视频
          </button>
          <button
            id="video-tab"
            class="tab"
            role="tab"
            aria-selected="false"
            aria-controls="video-input"
            data-i18n='[[0,"ui.7663e73034f1"]]'
          >
            视频找相似片段
          </button>
        </div>
        <form id="search-form">
          <div id="text-input" role="tabpanel" aria-labelledby="text-tab">
            <label class="sr-only" for="query" data-i18n='[[0,"ui.4dd0c7963b63"]]'
              >描述想找的画面</label
            ><textarea
              id="query"
              rows="3"
              maxlength="4000"
              placeholder="例如：雨夜，一个人坐在窗边，强忍眼泪，镜头慢慢推近…（Ctrl/⌘ + Enter 查找片段）"
              data-i18n-placeholder="ui.search_query_placeholder"
            ></textarea>
            <div class="examples">
              <span data-i18n='[[0,"ui.7b13ef5f91a0"]]'>试着描述</span
              ><button
                type="button"
                data-query="一个人欲言又止，强忍眼泪的近景"
                data-i18n-data-query="ui.035d390408af"
                data-i18n='[[0,"ui.dd8aa236a06d"]]'
              >
                含蓄情绪</button
              ><button
                type="button"
                data-query="两个人在夜晚的街道争吵，其中一人转身离开"
                data-i18n-data-query="ui.a67e9ae46dd8"
                data-i18n='[[0,"ui.f50b7e6128c3"]]'
              >
                人物互动</button
              ><button
                type="button"
                data-query="从背后拍摄一个人走进空旷房间"
                data-i18n-data-query="ui.63bd3494026d"
                data-i18n='[[0,"ui.87878d621aaf"]]'
              >
                镜头角度
              </button>
            </div>
          </div>
          <div
            id="image-input"
            class="search-media-input"
            role="tabpanel"
            aria-labelledby="image-tab"
            hidden
          >
            <label class="upload" for="image-file" id="image-drop"
              ><span class="upload-symbol">↥</span
              ><strong data-i18n='[[0,"ui.4ae55af3694d"]]'>选择一张参考图片</strong
              ><span id="image-file-label" data-i18n='[[0,"ui.2caffec04326"]]'
                >JPEG、PNG、WebP 静态图片 · 最大 20MB</span
              ><span class="upload-hint" data-i18n='[[0,"ui.293ffaf6e1cf"]]'
                >也可以把图片直接拖到这里</span
              ><input id="image-file" type="file" accept="image/jpeg,image/png,image/webp" /></label
            ><img id="image-preview" alt="参考图片预览" hidden data-i18n-alt="ui.039bbea93b63" />
          </div>
          <div
            id="video-input"
            class="search-media-input"
            role="tabpanel"
            aria-labelledby="video-tab"
            hidden
          >
            <label class="upload" for="video-file" id="video-drop"
              ><span class="upload-symbol">↥</span
              ><strong data-i18n='[[0,"ui.4483f7fef0d8"]]'>选择一段参考视频</strong
              ><span id="file-label" data-i18n='[[0,"ui.67fd2fc9b41a"]]'
                >最长 30 秒 · 最大 100MB</span
              ><span class="upload-hint" data-i18n='[[0,"ui.373edd22c7f2"]]'
                >也可以把视频直接拖到这里</span
              ><input id="video-file" type="file" accept="video/*" /></label
            ><video id="query-preview" controls hidden></video>
          </div>
          <div class="search-scope-row">
            <div class="material-filters">
              <label data-i18n='[[0,"ui.df2bc29adabb"]]'
                >素材范围<select id="source" multiple></select
              ></label>
            </div>
            <div id="person-filters">
              <div id="person-controls">
                <label data-i18n='[[0,"ui.acc714bb0167"]]'
                  >演员（可多选）<select
                    id="actor-select"
                    multiple
                    aria-describedby="person-hint"
                  ></select></label
                ><label data-i18n='[[0,"ui.224f21d3016f"]]'
                  >角色（可多选）<select
                    id="role-select"
                    multiple
                    aria-describedby="person-hint"
                  ></select
                ></label>
                <div class="person-search-options">
                  <label data-i18n='[[0,"ui.06cf3151c450"]]'
                    >人物检索方式<select id="person-mode">
                      <option value="auto" data-i18n='[[0,"ui.be93a225bcfb"]]'>
                        人物出镜 / 对白提及
                      </option>
                      <option value="onscreen" data-i18n='[[0,"ui.bc9173082f3e"]]'>人物出镜</option>
                      <option value="mentioned" data-i18n='[[0,"ui.cbf394311140"]]'>
                        对白提及
                      </option>
                    </select></label
                  ><label data-i18n='[[0,"ui.ac954c28b468"]]'
                    >多人物关系<select id="person-relation">
                      <option value="all" data-i18n='[[0,"ui.859a27c20c56"]]'>
                        同时出镜 / 全部提及
                      </option>
                      <option value="any" data-i18n='[[0,"ui.f61923e57f20"]]'>任一人物</option>
                    </select></label
                  >
                </div>
              </div>
              <p id="person-hint" class="sr-only" aria-live="polite"></p>
            </div>
          </div>
          <div class="search-filter-row">
            <label data-i18n='[[0,"ui.625b392c7b8a"]]'
              >场景<input
                id="scene"
                placeholder="例如：室内、雨夜"
                data-i18n-placeholder="ui.722889427cbf" /></label
            ><label data-i18n='[[0,"ui.61fe61644a75"]]'
              >人物情绪<input
                id="emotion"
                placeholder="例如：悲伤、克制"
                data-i18n-placeholder="ui.d637fe8494d8" /></label
            ><label data-i18n='[[0,"ui.6867f7b4537a"]]'
              >景别<input
                id="shot-size"
                placeholder="例如：近景、特写"
                data-i18n-placeholder="ui.79b85267c636" /></label
            ><label data-i18n='[[0,"ui.26b6f15b345b"]]'
              >最短时长（秒）<input id="min-duration" type="number" min="0" step="0.1" /></label
            ><label data-i18n='[[0,"ui.2de8ce6144b7"]]'
              >最长时长（秒）<input id="max-duration" type="number" min="0.1" step="0.1"
            /></label>
          </div>
          <div class="form-bottom">
            <label data-i18n='[[0,"ui.770c916c8efa"]]'
              >检索粒度<select id="granularity">
                <option value="moment" data-i18n='[[0,"ui.5aca155225fc"]]'>精细片段</option>
                <option value="shot" data-i18n='[[0,"ui.5d649f75d54a"]]'>完整镜头</option>
                <option value="scene" data-i18n='[[0,"ui.337ba7da75d2"]]'>连续场景</option>
              </select></label
            ><label data-i18n='[[0,"ui.63a1fd1a6eab"]]'
              >返回数量<select id="limit">
                <option>20</option>
                <option>10</option>
                <option>50</option>
              </select></label
            ><button
              class="quiet"
              id="filter-reset"
              type="button"
              data-i18n='[[0,"ui.4bbc4e5fd9db"]]'
            >
              清除筛选</button
            ><button
              class="submit"
              id="search-button"
              type="submit"
              data-i18n='[[0,"ui.b4ad13f10b53"]]'
            >
              查找片段 <span>↗</span>
            </button>
          </div>
        </form>
      </section>
      <div id="notice" class="notice" role="status" aria-live="polite"></div>
      <section class="results-section">
        <div class="results-heading">
          <h2 data-i18n='[[0,"ui.bc5df71373fd"]]'>检索结果 <span id="result-count"></span></h2>
          <span id="timing"></span>
        </div>
        <div id="results" class="results">
          <div class="empty">
            <span>⌕</span>
            <h3 data-i18n='[[0,"ui.2cb75dbbe057"]]'>你要找的画面，从这里开始</h3>
            <p data-i18n='[[0,"ui.063116e094a4"]]'>输入描述，或上传参考图片、视频。</p>
          </div>
        </div>
      </section>
      <details class="library-status">
        <summary data-i18n='[[0,"ui.ee3a656f795c"]]'>
          素材库状态 <span id="library-summary" data-i18n='[[0,"ui.fcabadb2a772"]]'>正在读取…</span>
        </summary>
        <div id="library-detail"></div>
      </details>
    </main>
    <footer>
      <span data-i18n='[[0,"ui.324b4bf6a897"]]'>Mindex / 素材检索工作台</span
      ><span data-i18n='[[0,"ui.ee0bd86ae2e6"]]'>文字、图片与视频查询 · 本地素材库</span>
    </footer>
    <dialog id="detail-dialog">
      <button
        id="close-dialog"
        class="quiet close"
        aria-label="关闭详情"
        data-i18n-aria-label="ui.6a3082724a14"
      >
        ✕
      </button>
      <div id="detail-content"></div>
    </dialog>
  </body>
</html>

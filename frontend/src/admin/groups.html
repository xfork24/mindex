  <body class="admin groups-page">
    <header>
      <a class="brand" href="/">m<span>index</span><i></i></a>
      <nav class="page-nav" aria-label="页面导航" data-i18n-aria-label="ui.main_navigation">
        <a class="quiet nav-link" href="/search" data-i18n='[[0,"ui.c9b1e68e3537"]]'>视频检索</a
        ><a class="quiet nav-link" href="/" data-i18n='[[0,"ui.b6fc3cef0bd0"]]'>创作</a
        ><a
          class="quiet nav-link"
          href="/admin"
          aria-current="page"
          data-i18n='[[0,"ui.f517302fec0d"]]'
          >素材管理</a
        ><a class="quiet nav-link" href="/persons" data-i18n='[[0,"ui.0973ef28d791"]]'>人物库</a
        ><a class="quiet nav-link" href="/settings" data-i18n='[[0,"ui.7debf9cb0372"]]'>设置</a>
      </nav>
      <div class="header-actions">
        <button hidden type="button" class="quiet" id="reload" data-i18n='[[0,"ui.162d2697ca9c"]]'>
          刷新素材</button
        ><button type="button" class="quiet theme-toggle" data-theme-toggle></button
        ><button
          type="button"
          class="quiet language-switch"
          data-language-toggle
          aria-label="中文 / English"
        >
          <span data-language="zh" lang="zh-CN">文</span
          ><span class="language-divider" aria-hidden="true">/</span
          ><span data-language="en" lang="en">En</span>
        </button>
      </div>
    </header>
    <main class="admin-main">
      <nav
        class="studio-tabs admin-tabs"
        aria-label="素材管理分区"
        data-i18n-aria-label="ui.admin_tabs_aria"
      >
        <a class="studio-tab" href="/admin" data-i18n='[[0,"ui.admin_tab_sources"]]'>素材</a
        ><a class="studio-tab" href="/admin/music" data-i18n='[[0,"ui.admin_tab_music"]]'>音乐库</a
        ><a
          class="studio-tab"
          href="/admin/groups"
          aria-current="page"
          data-i18n='[[0,"ui.groups_manage"]]'
          >管理</a
        >
      </nav>
      <section class="admin-intro">
        <h1 data-i18n='[[0,"ui.groups_page_title"]]'>组管理</h1>
        <p data-i18n='[[0,"ui.groups_help"]]'>
          维护素材组与音乐组，用作检索与创作流程的范围筛选；多选取并集，不选表示不限。
        </p>
      </section>
      <div id="groups-error" role="alert"></div>
      <div class="workspace">
        <aside class="source-panel">
          <label for="groups-kind" data-i18n='[[0,"ui.groups_manage"]]'>管理</label
          ><select id="groups-kind">
            <option value="source" data-i18n='[[0,"ui.groups_source"]]'>素材组</option>
            <option value="music" data-i18n='[[0,"ui.groups_music"]]'>音乐组</option>
          </select>
          <div id="groups-list"></div>
          <button id="groups-new" type="button" data-i18n='[[0,"ui.groups_new"]]'>新建组</button>
        </aside>
        <section class="segment-panel">
          <form id="groups-form" class="group-fields">
            <label data-i18n='[[0,"ui.groups_name"]]'
              >组名称<input id="groups-name" required maxlength="200"
            /></label>
            <label class="group-description-field" data-i18n='[[0,"ui.groups_description"]]'
              >说明<textarea id="groups-description" maxlength="4000" rows="2"></textarea>
            </label>
            <div class="group-actions">
              <button type="submit" data-i18n='[[0,"ui.groups_save"]]'>保存组信息</button
              ><button type="button" id="groups-delete" data-i18n='[[0,"ui.groups_delete"]]'>
                删除组
              </button>
            </div>
          </form>
          <div class="group-member-columns">
            <section class="group-member-section">
              <h2 id="groups-member-title"></h2>
              <div id="groups-members"></div>
              <div class="group-actions">
                <button id="groups-remove" type="button" data-i18n='[[0,"ui.groups_remove"]]'>
                  移除所选成员</button
                ><button id="groups-prev" type="button" data-i18n='[[0,"ui.groups_prev"]]'>
                  上一页</button
                ><span id="groups-member-page"></span
                ><button id="groups-next" type="button" data-i18n='[[0,"ui.groups_next"]]'>
                  下一页
                </button>
              </div>
            </section>
            <section class="group-member-section">
              <h2 data-i18n='[[0,"ui.groups_add_heading"]]'>添加成员</h2>
              <label for="groups-results" data-i18n='[[0,"ui.groups_library_choices"]]'
                >从现有库中多选</label
              ><select
                id="groups-results"
                multiple
                size="8"
                data-i18n-aria-label="ui.groups_library_choices"
              ></select>
              <p id="groups-library-status" class="muted" role="status"></p>
              <p id="groups-library-count" class="muted" aria-live="polite"></p>
              <div class="group-actions">
                <button
                  id="groups-select-visible"
                  type="button"
                  data-i18n='[[0,"ui.groups_select_visible"]]'
                >
                  全选当前结果</button
                ><button
                  id="groups-clear-selection"
                  type="button"
                  data-i18n='[[0,"ui.groups_clear_selection"]]'
                >
                  清空选择</button
                ><button id="groups-add" type="button" data-i18n='[[0,"ui.groups_add"]]'>
                  添加所选成员
                </button>
              </div>
            </section>
          </div>
        </section>
      </div>
    </main>
    <script src="/assets/shared/group-controls.js?v=200a6e2ce7" defer></script>
    <footer>
      <span data-i18n='[[0,"ui.footer_groups"]]'>Mindex / 素材管理</span
      ><span data-i18n='[[0,"ui.footer_groups_hint"]]'>组用于检索与创作的范围筛选</span>
    </footer>
  </body>
</html>
